<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>


<style>
    body {
        font-family: Arial;
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .login-box {
        background: white;
        padding: 30px;
        border-radius: 10px;
        width: 300px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    input, button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 10px;
        display:block;
        background-color: rgb(200, 204, 207);
        border: none;

    }

    button {
        background: #f0a80c;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background: #7e5304;
    }

    h2 {
        text-align: center;
        font-size: 2rem;
    }

    .error {
        color: red;
        text-align: center;
    }
</style>


</head>
<body>

<div class="login-box">


<h2>Admin Login </h2>

<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p class="error" id="error"></p>


</div>

<script>

function login() {

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    fetch("http://localhost:8080/admin/login", {

        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password
        })

    })
    .then(res => res.text())
    .then(data => {

        if (data === "SUCCESS") {

            alert("Login Successful");

            window.location.href = "admin.html";

        } else {

            document.getElementById("error").innerText = "Invalid Credentials";

        }

    });

}

</script>

</body>
</html>
